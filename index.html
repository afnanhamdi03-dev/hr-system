<meta name="theme-color" content="#5B1433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a deep wine rail beside warm paper; a greeting hero carries the day's work; every request reads as a route of approval stops. */
:root{
  --bg:#F6F1EF; --surface:#FFFFFF; --sunk:#F0E9E7; --ink:#1E1316; --muted:#7A686E; --line:#E9DEDB;
  --accent:#7A1F45; --accent-ink:#FFFFFF; --accent-soft:#F5E5EB; --gold:#B88A3E;
  --rail:#1F0E15; --rail-ink:#EADDE2; --rail-muted:#A58F98; --rail-hi:#3A1A28;
  --ok:#1C7350; --ok-soft:#E2F2E9; --warn:#985A06; --warn-soft:#FBEFD8; --bad:#AE2A2A; --bad-soft:#FBE4E2; --info:#2C5AA0; --info-soft:#E6EEF9;
  --display:"Thmanyah Serif Display","Thmanyah Sans",system-ui,sans-serif;
  --body:"Thmanyah Sans",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:18px; --shadow:0 1px 1px rgba(60,20,30,.04),0 8px 28px -8px rgba(60,20,30,.10);
  --shadow-hi:0 2px 4px rgba(60,20,30,.06),0 18px 40px -12px rgba(60,20,30,.22);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#140C0F; --surface:#1E1418; --sunk:#181013; --ink:#F4ECEF; --muted:#B39FA7; --line:#33252B;
  --accent:#E883AA; --accent-ink:#2A0C18; --accent-soft:#3A1E29; --gold:#D9B26C;
  --rail:#0E070A; --rail-ink:#EADDE2; --rail-muted:#9A8590; --rail-hi:#2A1520;
  --ok:#62CC9A; --ok-soft:#18302A; --warn:#E9B25A; --warn-soft:#382A14; --bad:#F28D88; --bad-soft:#3C1C1C; --info:#8AB1F2; --info-soft:#1B2840;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.5); --shadow-hi:0 18px 40px -12px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#140C0F; --surface:#1E1418; --sunk:#181013; --ink:#F4ECEF; --muted:#B39FA7; --line:#33252B;
  --accent:#E883AA; --accent-ink:#2A0C18; --accent-soft:#3A1E29; --gold:#D9B26C;
  --rail:#0E070A; --rail-ink:#EADDE2; --rail-muted:#9A8590; --rail-hi:#2A1520;
  --ok:#62CC9A; --ok-soft:#18302A; --warn:#E9B25A; --warn-soft:#382A14; --bad:#F28D88; --bad-soft:#3C1C1C; --info:#8AB1F2; --info-soft:#1B2840;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.5); --shadow-hi:0 18px 40px -12px rgba(0,0,0,.6); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:0}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15.5px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.grow{flex:1;min-width:0}

.app{display:grid;grid-template-columns:256px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(140deg,#B3456D,#7A1F45 60%,#4A0F27);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px -6px rgba(180,60,100,.7)}
.brand b{display:block;font-family:var(--display);font-size:17px;color:#fff}
.brand small{color:var(--rail-muted);font-size:12.5px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:start;width:100%;color:var(--rail-muted);font-weight:500;transition:background .15s,color .15s}
.nav:hover{background:var(--rail-hi);color:var(--rail-ink)}
.nav.on{background:linear-gradient(90deg,rgba(232,131,170,.0),rgba(232,131,170,.16));color:#fff;box-shadow:inset -3px 0 0 #E883AA}
.nav .badge{margin-inline-start:auto}
.rail-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--rail-hi);font-size:12px;color:var(--rail-muted)}
.sheet .nav{color:var(--muted)} .sheet .nav.on{color:var(--accent);background:var(--accent-soft);box-shadow:none}
.ic{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:21px}
.top .sp{flex:1}
.page{padding:26px 28px 120px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:500;white-space:nowrap;transition:transform .12s,box-shadow .15s,border-color .15s,filter .15s}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line));box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn.light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(6px)}
.btn.light:hover{background:rgba(255,255,255,.22)}
.btn.white{background:#fff;color:#5A1532;border-color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px 30px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,#C25A7E 0%,transparent 45%),radial-gradient(90% 120% at 100% 100%,#2A0A18 0%,transparent 55%),linear-gradient(135deg,#5B1433 0%,#7A1F45 45%,#9B3157 100%);box-shadow:0 24px 50px -24px rgba(90,20,50,.7)}
.hero::before{content:"";position:absolute;inset-inline-start:-80px;bottom:-140px;width:340px;height:340px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;inset-inline-start:-20px;bottom:-200px;width:340px;height:340px;border-radius:50%;border:1px solid rgba(255,255,255,.10)}
.hero .date{font-size:13px;opacity:.82;display:flex;gap:10px;flex-wrap:wrap}
.hero h1{font-size:32px;margin:6px 0 6px;color:#fff}
.hero p{margin:0;opacity:.9;max-width:560px;font-size:16px}
.hero .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1}
.hero-stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:1}
.hero-stats div b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-stats div span{font-size:12.5px;opacity:.8}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset-inline-end:0;top:0;bottom:0;width:3px;background:var(--line)}
.kpi b{display:block;font-family:var(--display);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi b small{font-size:14px;color:var(--muted);font-family:var(--body)}
.kpi span{color:var(--muted);font-size:13px}
.kpi.alert b{color:var(--bad)} .kpi.alert::after{background:var(--bad)}
.kpi.warnk b{color:var(--warn)} .kpi.warnk::after{background:var(--warn)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.lg{font-size:14px;padding:4px 14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#E05A8A;color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.chip{--c:#666;display:inline-flex;align-items:center;padding:2px 9px;border-radius:7px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 85%,var(--ink))}
.t-teal{--c:#0E8074}.t-sky{--c:#1F78B4}.t-amber{--c:#B7700A}.t-violet{--c:#6D48C7}.t-green{--c:#2E8540}.t-rose{--c:#C23B6A}.t-gold{--c:#A07A10}.t-indigo{--c:#4352B0}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--line);flex:none}
.stripe.bad{background:var(--bad)}.stripe.warn{background:var(--warn)}.stripe.ok{background:var(--ok)}.stripe.info{background:var(--info)}

.route{display:flex;align-items:center;gap:3px;margin-top:7px;flex-wrap:wrap}
.stop{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:7px;background:var(--sunk);color:var(--muted)}
.stop.done{background:var(--ok-soft);color:var(--ok)}
.stop.current{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 0 0 3px var(--accent-soft)}
.stop.returned{background:var(--warn-soft);color:var(--warn);font-weight:600}
.stop.rejected{background:var(--bad-soft);color:var(--bad);font-weight:600}
.route i{width:10px;height:1px;background:var(--line)}

.why{border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.why.warn{border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:var(--warn-soft)}
.why.ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--line));background:var(--ok-soft)}
.why.bad{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));background:var(--bad-soft)}
.why b{font-family:var(--display)}

.steps{display:flex;flex-direction:column;position:relative}
.step{display:grid;grid-template-columns:32px 1fr;gap:12px;padding-bottom:18px;position:relative}
.step::before{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--ok)}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);font-weight:700;font-size:13px;border:2px solid var(--line);z-index:1}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.current .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px var(--accent-soft)}
.step.returned .dot{background:var(--warn);border-color:var(--warn);color:#fff}
.step.rejected .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.step .who{color:var(--muted);font-size:13px}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;cursor:pointer}
.check:hover{border-color:var(--accent)}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.check.done{color:var(--muted);text-decoration:line-through}

.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 18px}
.dl div span{display:block;color:var(--muted);font-size:12px}
.dl div b{font-weight:600}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:13px;flex-wrap:wrap;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.big button{padding:9px 18px;font-size:15px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;min-width:0;transition:border-color .15s,box-shadow .15s}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
label.f .in{color:var(--ink);font-size:15px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}

table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:start;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr{cursor:pointer;transition:background .12s}
.tb tbody tr:hover{background:var(--sunk)}
.scroll{overflow-x:auto}

.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent-soft),color-mix(in srgb,var(--accent) 22%,var(--surface)));color:var(--accent);font-weight:700;font-family:var(--display);flex:none;font-size:14px}
.av.sm{width:30px;height:30px;font-size:12px}.av.lg{width:48px;height:48px;font-size:18px}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:170px;border:1px solid var(--line)}
.col h3{display:flex;justify-content:space-between;padding:2px 4px 4px;font-size:14px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kc .acts{display:flex;gap:6px;justify-content:space-between}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.bar .track,.part .track{height:9px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill,.part .fill{height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));border-radius:99px}
.bar .fill.bad{background:var(--bad)}

.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty.sm{padding:14px;font-size:13px}

/* custody */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ccard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.ccard:focus-visible{outline:2px solid var(--accent)}
.ccard-top{display:flex;justify-content:space-between;align-items:center}
.ctitle{font-family:var(--display);font-size:16.5px;margin-top:4px}
.cholder{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin:4px 0}
.cmeta{display:flex;gap:6px;flex-wrap:wrap}
.chero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.fact span{font-size:12px;color:var(--muted)}
.fact b{font-family:var(--display);font-size:16px}
.fact small{font-size:12px;color:var(--muted)}
.fact.big{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.fact.big b{color:var(--accent);font-size:19px}
.accs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acc{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:13.5px}
.actcard{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* performance */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:14px}
.mhead{display:flex;gap:12px;align-items:center}
.part{display:flex;flex-direction:column;gap:5px}
.quote{font-size:13.5px;background:var(--sunk);border-radius:12px;padding:9px 12px;color:var(--muted)}
.ring .ring-bg{fill:none;stroke:var(--sunk);stroke-width:6}
.ring .ring-fg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round}
.ring text{font-family:var(--display);font-size:16px;font-weight:700;fill:var(--ink)}
.krows{display:flex;flex-direction:column;gap:10px}

/* ---------- dates ---------- */
const DAY = 86400000;
function d0(s) { let d; if (typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s)) { const p = s.split('-'); d = new Date(+p[0], +p[1] - 1, +p[2]); } else { d = s ? new Date(s) : new Date(); } d.setHours(0, 0, 0, 0); return d; }
function iso(d) { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function addDays(s, n) { return iso(d0(s).getTime() + n * DAY); }
function daysBetween(a, b) { return Math.round((d0(b) - d0(a)) / DAY); }
function nextBirthday(birth, today) {
  if (!birth) return null;
  const b = d0(birth), t = d0(today);
  let n = new Date(t.getFullYear(), b.getMonth(), b.getDate());
  if (n < t) n = new Date(t.getFullYear() + 1, b.getMonth(), b.getDate());
  return iso(n);
}

function weekStart(s) { const d = d0(s); d.setDate(d.getDate() - d.getDay()); return iso(d); }
function weekLabel(start) { const a = d0(start), b = d0(addDays(start, 4)); const M = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر']; return 'أسبوع ' + a.getDate() + (a.getMonth() !== b.getMonth() ? ' ' + M[a.getMonth()] : '') + ' – ' + b.getDate() + ' ' + M[b.getMonth()]; }
/* ---------- money ---------- */
function wage(e) { return (+e.basic || 0) + (+e.housing || 0) + (+e.transport || 0) + (+e.other || 0); }

/* End of service, Saudi Labor Law Art. 84 / 85 / 87 / 80 */
function eosCalc(w, years, reason) {
  const full = years <= 5 ? years * w / 2 : 5 * w / 2 + (years - 5) * w;
  let f = 1, note = 'مكافأة كاملة (م ٨٤)';
  if (reason === 'resign') {
    if (years < 2) { f = 0; note = 'استقالة قبل سنتين: لا يستحق (م ٨٥)'; }
    else if (years < 5) { f = 1 / 3; note = 'استقالة من ٢ إلى أقل من ٥ سنوات: ثلث المكافأة (م ٨٥)'; }
    else if (years < 10) { f = 2 / 3; note = 'استقالة من ٥ إلى أقل من ١٠ سنوات: ثلثا المكافأة (م ٨٥)'; }
    else { note = 'استقالة بعد ١٠ سنوات: المكافأة كاملة (م ٨٥)'; }
  } else if (reason === 'art87') { note = 'قوة قاهرة أو خلال ٦ أشهر من الزواج / ٣ أشهر من الولادة: كاملة (م ٨٧)'; }
  else if (reason === 'art80') { f = 0; note = 'فصل وفق المادة ٨٠: لا يستحق'; }
  return { full, due: full * f, f, note };
}

/* ---------- request factory ---------- */
function buildRequest(base, cfg, nowIso) {
  const t = TYPES[base.type];
  let steps = t.steps(base, cfg);
  if (base.noManager) steps = steps.filter(s => s.role !== 'manager');
  steps.forEach((s, i) => { s.status = i === 0 ? 'current' : 'waiting'; if (i === 0) s.startedAt = nowIso; });
  return Object.assign({}, base, {
    status: 'in_progress', cur: 0, steps,
    createdAt: nowIso, updatedAt: nowIso,
    log: [{ at: nowIso, by: base.createdBy || null, act: 'تم إنشاء الطلب', note: '' }]
  });
}

async function actOn(r0, kind, note) {
  const r = JSON.parse(JSON.stringify(r0)); const now = new Date().toISOString();
  const st = r.steps[r.cur]; const by = S.uid, asRole = role();
  if (kind === 'approve') {
    st.status = 'done'; st.at = now; st.by = by; st.note = note || '';
    r.log.push({ at: now, by, asRole, act: 'اعتماد: ' + st.label, note: note || '' });
    if (r.steps[r.cur + 1]) { r.cur++; r.steps[r.cur].status = 'current'; r.steps[r.cur].startedAt = now; }
    else { r.status = 'approved'; await sideEffects(r); }
  } else if (kind === 'return') {
    st.status = 'returned'; st.at = now; st.by = by; st.note = note; r.status = 'returned';
    r.log.push({ at: now, by, asRole, act: 'إعادة للاستكمال: ' + st.label, note });

}

  });
  S.data.requests.filter(r => r.dueDate && r.status === 'in_progress').forEach(r => { const n = daysBetween(T, r.dueDate); if (n <= 7) out.push({ n, lvl: n < 0 ? 'bad' : 'warn', t: (n < 0 ? 'دفعة متأخرة: ' : 'دفعة مستحقة: ') + reqTitle(r), s: money(r.amount) + ' · ' + fmtD(r.dueDate) + ' · واقفة عند ' + r.steps[r.cur].label, req: r.id, kind: 'دفعة' }); });
  return out.sort((a, b) => a.n - b.n);

function closeModal() { S.modal = null; const s = $('#sheet'); if (s) s.remove(); }
function sheet(title, body, foot) {
  let el = $('#sheet'); if (!el) { el = document.createElement('div'); el.id = 'sheet'; el.className = 'scrim'; document.body.appendChild(el); el.addEventListener('click', e => { if (e.target === el) closeModal(); }); }
  el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-h"><h2>' + title + '</h2><button class="btn ghost sm" data-close="1" aria-label="إغلاق">' + ic('x') + '</button></div><div class="sheet-b">' + body + '</div>' + (foot ? '<div class="sheet-f">' + foot + '</div>' : '') + '</div>';
}
function renderModal() {
  const m = S.modal; if (!m) return;
  if (m.kind === 'req') return reqSheet(m.id);
  if (m.kind === 'emp') return empSheet(m.id);
  if (m.kind === 'cust') return custSheet(m.id);
  if (m.kind === 'task') return taskSheet(m.id);
  if (m.kind === 'rep') return repSheet(m.id);
}

function reqSheet(id) {
  const r = S.data.requests.find(x => x.id === id); if (!r) { closeModal(); return; }
  const w = where(r), t = TYPES[r.type], can = canAct(r) && canWrite();
  const fields = [['رقم الطلب', r.no || '—'], ['صاحب الطلب', reqWho(r)]];
  if (r.leaveType) fields.push(['نوع الإجازة', r.leaveType]);
  if (r.from) fields.push(['من', fmtD(r.from)], ['إلى', fmtD(r.to)], ['عدد الأيام', r.days]);
  if (r.type === 'leave' && emp(r.employeeId)) fields.push(['الرصيد السنوي الحالي', (emp(r.employeeId).annualBalance ?? '—') + ' يوم']);
  if (r.date) fields.push(['التاريخ', fmtD(r.date)], ['الوقت', (r.fromTime || '') + ' - ' + (r.toTime || '')]);
  if (r.amount) fields.push(['المبلغ', money(r.amount)]);
  if (r.months) fields.push(['الأقساط', r.months + ' أشهر · ' + money(r.amount / r.months) + ' شهرياً']);
  if (r.type === 'advance' && emp(r.employeeId)) fields.push(['القسط من إجمالي الأجر', Math.round((r.amount / r.months) * 100 / (wage(emp(r.employeeId)) || 1)) + '٪']);
  if (r.category) fields.push(['البند', r.category]);
  if (r.docType) fields.push(['المستند', r.docType]);
  if (r.dueDate) fields.push(['تاريخ الاستحقاق', fmtD(r.dueDate)]);
  if (r.ref) fields.push(['رقم السداد', r.ref]);
  if (r.vendor) fields.push(['الجهة', r.vendor]);
  if (r.newBasic) { const e = emp(r.employeeId); fields.push(['الأساسي الحالي', e ? money(e.basic) : '—'], ['الأساسي المقترح', money(r.newBasic)]); if (e) fields.push(['نسبة الزيادة', Math.round((r.newBasic - e.basic) * 100 / (e.basic || 1)) + '٪']); }
  if (r.effective) fields.push(['تاريخ السريان', fmtD(r.effective)]);
  if (r.position) fields.push(['الوظيفة', r.position], ['القسم', r.dept || '—'], ['العدد', r.headcount || 1], ['الراتب المقترح', money(r.budget)]);
  fields.push(['تاريخ الإنشاء', fmtDT(r.createdAt)]);
  let why = '<div class="why ' + w.cls + '"><b>' + esc(w.head) + '</b>';
  if (r.status === 'in_progress') {
    why += '<div class="small">' + esc(w.sub) + (w.over ? ' · <b>تجاوز المهلة</b>' : '') + '</div>';
    why += '<div class="small" style="margin-top:6px"><b>لماذا لم يُعتمد بعد؟</b> ' + (w.miss.length ? 'باقي ' + w.miss.length + ' من متطلبات القرار: ' + w.miss.map(esc).join('، ') + '.' : 'المتطلبات مكتملة وينتظر ضغط زر الاعتماد من ' + esc(stepOwners(r.steps[r.cur], r)) + '.') + '</div>';
  } else if (w.body) why += '<div class="small">' + esc(w.body) + '</div>';
  why += '</div>';
  const steps = '<div class="steps">' + r.steps.map((s, i) => {
    const isCur = i === r.cur && r.status === 'in_progress';
    let x = '<div class="step ' + s.status + '"><div class="dot">' + (s.status === 'done' ? '✓' : s.status === 'rejected' ? '✕' : s.status === 'returned' ? '↩' : (i + 1)) + '</div><div><b>' + esc(s.label) + '</b><div class="who">' + esc(stepOwners(s, r)) + ' · المهلة ' + s.sla + ' يوم' + (s.at ? ' · ' + fmtDT(s.at) : '') + (s.by ? ' · ' + esc(userName(s.by)) : '') + '</div>' + (s.note ? '<div class="small" style="margin-top:4px">«' + esc(s.note) + '»</div>' : '');
    if (s.checks.length && (isCur || s.status === 'done')) x += '<div class="checks">' + s.checks.map((c, ci) => '<label class="check ' + (c.done ? 'done' : '') + '"><input type="checkbox" ' + (c.done ? 'checked' : '') + ' ' + (isCur && can ? 'data-chk="' + ci + '"' : 'disabled') + '><span>' + esc(c.t) + '</span></label>').join('') + '</div>';
    return x + '</div></div>';
  }).join('') + '</div>';
  const log = '<div class="timeline">' + (r.log || []).slice().reverse().map(l => '<div class="tl"><time>' + fmtDT(l.at) + '</time><div><b>' + esc(l.act) + '</b><div class="small muted">' + esc([userName(l.by), l.asRole ? ROLES[l.asRole] : ''].filter(Boolean).join(' · ') || 'النظام') + '</div>' + (l.note ? '<div class="small">' + esc(l.note) + '</div>' : '') + '</div></div>').join('') + '</div>';
  const body = why + '<section class="card"><div class="dl">' + fields.map(f => '<div><span>' + f[0] + '</span><b>' + esc(f[1]) + '</b></div>').join('') + '</div>' + (r.reason ? '<p style="margin:12px 0 0"><span class="muted small">التفاصيل</span><br>' + esc(r.reason) + '</p>' : '') + '</section><section class="card"><h3 style="margin-bottom:12px">مسار الاعتماد</h3>' + steps + '</section><section class="card"><h3 style="margin-bottom:10px">سجل الإجراءات</h3>' + log + '</section>' +
    ((can || (r.status === 'returned' && canWrite())) ? '<label class="f">ملاحظة القرار <span class="small">(إلزامية عند الإعادة أو الرفض)</span><textarea class="in" id="actNote" rows="2"></textarea></label>' : '');
  let foot = '';
  if (can) { const missing = r.steps[r.cur].checks.filter(c => !c.done).length; foot = '<button class="btn ok" data-act="approve" ' + (missing ? 'disabled title="أكملي متطلبات القرار أولاً"' : '') + '>اعتماد' + (missing ? ' (باقي ' + missing + ')' : '') + '</button><button class="btn" data-act="return">إعادة للاستكمال</button><button class="btn bad" data-act="reject">رفض</button>'; }
  else if (r.status === 'returned' && canWrite() && (r.createdBy === S.uid || isHR())) foot = '<button class="btn pri" data-act="resubmit">إعادة الإرسال بعد الاستكمال</button><button class="btn bad" data-act="cancel">إلغاء الطلب</button>';
  else if (r.status === 'in_progress' && canWrite() && (r.createdBy === S.uid || isHR())) foot = '<button class="btn bad" data-act="cancel">إلغاء الطلب</button>';
  const scroll = ($('#sheet .sheet') || {}).scrollTop || 0;
  const note = ($('#actNote') || {}).value || '';
  const hadFocus = document.activeElement && document.activeElement.id === 'actNote';
  sheet('<span class="chip t-' + t.color + '">' + t.label + '</span> ' + esc(reqTitle(r)), body, foot);
  const sh = $('#sheet .sheet'); if (sh) sh.scrollTop = scroll; if ($('#actNote')) { $('#actNote').value = note; if (hadFocus) $('#actNote').focus(); }
}

function empSheet(id) {
  const e = emp(id); if (!e) { closeModal(); return; }
  const tab = S.modal.tab || 'info', T = TODAY(), hr = isHR() || role() === 'finance';
  const tabs = [['info', 'البيانات'], ['contract', 'العقد'], ['reqs', 'الطلبات'], ['custody', 'العهد'], ['perf', 'الأداء']].concat(hr ? [['salary', 'الراتب'], ['eos', 'نهاية الخدمة']] : []);
  let b = '<div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:52px;height:52px;font-size:19px">' + esc(initials(e.name)) + '</div><div><h2>' + esc(e.name) + '</h2><div class="muted">' + esc(e.title) + ' · ' + esc(e.dept) + '</div></div><span class="sp" style="flex:1"></span><span class="pill ' + (e.status === 'نشط' ? 'ok' : 'warn') + '">' + esc(e.status) + '</span></div>';
  b += '<div class="tabs">' + tabs.map(t => '<button data-etab="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</div>';
  if (tab === 'info') {
    const sick = S.data.requests.filter(r => r.employeeId === e.id && r.type === 'leave' && r.leaveType === 'مرضية' && r.status === 'approved' && daysBetween(r.from, T) <= 365).reduce((s, r) => s + (+r.days || 0), 0);
    b += '<div class="card"><div class="dl">' + [['الرقم الوظيفي', e.id.toUpperCase()], ['المدير المباشر', e.managerId ? empName(e.managerId) : '—'], ['الجنسية', e.nationality], ['تاريخ الميلاد', fmtD(e.birthDate)], ['الجوال', e.phone || '—'], ['البريد', e.email || '—'], ['رصيد الإجازة السنوية', (e.annualBalance ?? '—') + ' يوم'], ['الإجازات المرضية آخر ١٢ شهر', sick + ' يوم' + (sick > 30 ? (sick > 90 ? ' (بدون أجر)' : ' (بثلاثة أرباع الأجر)') : ' (بأجر كامل)')], ['موقع العمل', e.workLocation || 'غير محدد'], ['توثيق العقد في قوى', e.contractDocumented === false ? 'غير موثّق' : 'موثّق'], e.iqamaExpiry ? ['انتهاء الإقامة', fmtD(e.iqamaExpiry)] : null].filter(Boolean).map(f => '<div><span>' + f[0] + '</span><b>' + esc(f[1]) + '</b></div>').join('') + '</div></div>';
  } else if (tab === 'contract') {
    const n = e.contractEnd ? daysBetween(T, e.contractEnd) : null, p = e.probationEnd ? daysBetween(T, e.probationEnd) : null;
    b += '<div class="card"><div class="dl">' + [['تاريخ المباشرة', fmtD(e.joinDate)], ['نوع العقد', e.contractType], ['انتهاء العقد', e.contractEnd ? fmtD(e.contractEnd) + ' (' + rel(n) + ')' : 'غير محدد المدة'], ['نهاية التجربة', e.probationEnd ? fmtD(e.probationEnd) + (p >= 0 ? ' (' + rel(p) + ')' : ' (انتهت)') : '—'], ['مدة الخدمة', (daysBetween(e.joinDate, T) / 365.25).toFixed(1) + ' سنة']].concat(e.noticeEnd ? [['فترة الإشعار', 'تنتهي ' + fmtD(e.noticeEnd) + ' · ' + (e.noticeReason || '')]] : []).map(f => '<div><span>' + f[0] + '</span><b>' + esc(f[1]) + '</b></div>').join('') + '</div></div>';
    if (isHR() && canWrite() && !e.noticeEnd && e.status === 'نشط') b += '<div class="card"><h3>بدء فترة إشعار</h3><p class="small muted">م ٧٥: إذا كان الإنهاء من الموظف فالإشعار ٣٠ يوماً، ومن صاحب العمل ٦٠ يوماً، ما لم ينص العقد على مدة أطول.</p><div class="toolbar"><select class="in" id="nReason"><option value="استقالة">استقالة (٣٠ يوم)</option><option value="إنهاء من صاحب العمل">إنهاء من صاحب العمل (٦٠ يوم)</option><option value="عدم تجديد العقد">عدم تجديد العقد</option></select><button class="btn" data-notice="' + esc(e.id) + '">بدء الإشعار</button></div></div>';
  } else if (tab === 'reqs') {
    const rs = S.data.requests.filter(r => r.employeeId === e.id && canSee(r));
    b += '<div class="card">' + (rs.length ? '<div class="list">' + rs.map(reqRow).join('') + '</div>' : '<div class="empty">لا توجد طلبات.</div>') + '</div>';
  } else if (tab === 'custody') {
    const ks = S.data.custody.filter(k => k.employeeId === e.id || (k.history || []).some(h => h.employeeId === e.id));
    b += '<div class="card">' + (ks.length ? '<div class="list">' + ks.map(k => { const now = k.employeeId === e.id; return '<div class="row" data-cust="' + esc(k.id) + '"><span class="stripe ' + (now ? 'info' : '') + '"></span><div class="grow"><div class="t">' + esc(k.item) + '</div><div class="s">' + esc(k.category || '') + ' · ' + (now ? 'لديه منذ ' + durText(daysBetween(k.handedAt, TODAY())) + ' · الحالة عند التسليم: ' + esc(k.condition || '—') : 'سُلّمت سابقاً واستُلمت') + '</div></div><span class="pill ' + (now ? 'acc' : '') + '">' + (now ? esc(custSt(k)) : 'مُرجعة') + '</span></div>'; }).join('') + '</div>' : '<div class="empty">لا توجد عهد.</div>') + '</div>';
  } else if (tab === 'perf') {
    const vs = S.data.reviews.filter(v => v.employeeId === e.id && revDir(v) === 'down');
    b += '<div class="card">' + (vs.length ? '<div class="list">' + vs.map(v => { const s = revScore(v), l = revLabel(s); return '<div class="row" data-rev="' + esc(v.id) + '"><div class="grow"><div class="t">' + esc(v.period) + '</div><div class="s">' + esc(v.status) + '</div></div><b class="num">' + s.toFixed(1) + '</b><span class="pill ' + l[1] + '">' + l[0] + '</span></div>'; }).join('') + '</div>' : '<div class="empty">لا توجد تقييمات.</div>') + '</div>';
  } else if (tab === 'salary') {
    b += '<div class="card"><table class="tb"><tbody>' + [['الراتب الأساسي', e.basic], ['بدل السكن', e.housing], ['بدل النقل', e.transport], ['بدلات أخرى', e.other]].map(x => '<tr style="cursor:default"><td>' + x[0] + '</td><td class="money">' + money(x[1]) + '</td></tr>').join('') + '<tr style="cursor:default"><td><b>إجمالي الأجر</b></td><td class="money"><b>' + money(wage(e)) + '</b></td></tr></tbody></table><p class="small muted">الأجر الشامل هو أساس حساب مكافأة نهاية الخدمة (الأساسي + البدلات الثابتة).</p></div>';
  } else if (tab === 'eos') {
    const yrs = Math.max(0, daysBetween(e.joinDate, S.modal.eosDate || T) / 365.25);
    const reason = S.modal.eosReason || 'employer';
    const c = eosCalc(wage(e), yrs, reason);
    b += '<div class="card"><div class="form"><label class="f">تاريخ نهاية الخدمة<input class="in" type="date" id="eosDate" value="' + esc(S.modal.eosDate || T) + '"></label><label class="f">سبب الانتهاء<select class="in" id="eosReason">' + [['employer', 'إنهاء من صاحب العمل / انتهاء العقد / اتفاق'], ['resign', 'استقالة'], ['art87', 'قوة قاهرة / زواج / ولادة (م ٨٧)'], ['art80', 'فصل وفق المادة ٨٠']].map(o => '<option value="' + o[0] + '" ' + (reason === o[0] ? 'selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label></div>' +
      '<div class="dl" style="margin-top:14px">' + [['مدة الخدمة', yrs.toFixed(2) + ' سنة'], ['الأجر الشامل', money(wage(e))], ['المكافأة الكاملة', money(c.full)]].map(f => '<div><span>' + f[0] + '</span><b>' + esc(f[1]) + '</b></div>').join('') + '</div>' +
      '<div class="why ' + (c.f ? 'ok' : 'bad') + '" style="margin-top:14px"><b>المستحق: ' + money(c.due) + '</b><div class="small">' + esc(c.note) + '</div><div class="small muted">نصف أجر عن كل سنة من الخمس الأولى، وأجر كامل عن كل سنة بعدها، والكسور بالنسبة.</div></div>' +
      (isHR() && canWrite() && c.due > 0 ? '<button class="btn" style="margin-top:12px" data-eospay="' + esc(e.id) + '" data-amt="' + Math.round(c.due) + '">إنشاء دفعة مستحقات نهاية الخدمة</button>' : '') + '</div>';
  }
  const foot = (isHR() && canWrite() ? '<button class="btn" data-editemp="' + esc(e.id) + '">تعديل البيانات</button>' : '') + (canWrite() ? '<button class="btn pri" data-newfor="' + esc(e.id) + '">طلب لهذا الموظف</button>' : '');
  const sc = ($('#sheet .sheet') || {}).scrollTop || 0;
  sheet('ملف الموظف', b, foot);
  const sh = $('#sheet .sheet'); if (sh) sh.scrollTop = sc;
}

const empOpts = (blank) => (blank ? [['', blank]] : []).concat(S.data.employees.filter(e => e.status !== 'منتهي').map(e => [e.id, e.name]));
const vals = (ids) => { const o = {}; ids.forEach(k => { const el = $('#f_' + k); if (el) o[k] = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value.trim(); }); return o; };
